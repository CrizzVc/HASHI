[package]
name = "hashi"
version = "1.0.1"
description = "HASHI - game launcher"
authors = ["CrizzVc"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hashi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2.7.0"
base64 = "0.22"
image = "0.25"
md-5 = "0.11.0"
sysinfo = "0.38.4"
regex = "1.13.1"
url = "2"
reqwest = { version = "0.12", features = ["json"] }
